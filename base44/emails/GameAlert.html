<mjml>
  <mj-head>
    <mj-title>AquaTycoon Park Alert</mj-title>
    <mj-preview>You have a new park alert from AquaTycoon</mj-preview>
    <mj-attributes>
      <mj-all font-family="Inter, Helvetica, Arial, sans-serif" />
      <mj-section background-color="#ffffff" padding="0 36px" />
      <mj-text color="#125054" font-size="15px" line-height="1.6" padding="0" />
      <mj-button background-color="#34895e" color="#000000" border-radius="7px" font-weight="700" inner-padding="14px 28px" align="left" />
    </mj-attributes>
  </mj-head>
  <mj-body background-color="#f5e9d1">
    <mj-section background-color="#34895e" padding="20px 36px">
      <mj-column>
        <mj-image src="https://media.base44.com/images/public/6ac25dbb5ee14d464392354b/a978b1552_logo.png" width="48px" alt="AquaTycoon" />
        <mj-text color="#000000" font-size="22px" font-family="Fredoka, Arial, sans-serif" font-weight="700" padding="8px 0 0">
          AquaTycoon
        </mj-text>
      </mj-column>
    </mj-section>

    <mj-section padding="32px 36px 12px">
      <mj-column>
        <mj-text font-family="Fredoka, Arial, sans-serif" font-size="13px" font-weight="700" letter-spacing="2px" color="#34895e" text-transform="uppercase">
          {{alert_label}}
        </mj-text>
        <mj-text font-family="Fredoka, Arial, sans-serif" font-size="26px" font-weight="700" color="#125054" line-height="1.2" padding="6px 0 0">
          {{alert_title}}
        </mj-text>
      </mj-column>
    </mj-section>

    <mj-section padding="8px 36px 28px">
      <mj-column>
        <mj-text color="#475569" font-size="15px" line-height="1.6">
          {{alert_message}}
        </mj-text>
      </mj-column>
    </mj-section>

    <mj-section padding="0 36px 32px">
      <mj-column>
        <mj-button background-color="#34895e" color="#000000" href="https://optimal-aqua-tycoon-flow.base44.app" border-radius="7px">
          Open Your Park
        </mj-button>
      </mj-column>
    </mj-section>

    <mj-section background-color="#f5e9d1" padding="16px 36px">
      <mj-column>
        <mj-text color="#475569" font-size="11px" align="center">
          You received this alert from AquaTycoon. Open the game to continue managing your park.
        </mj-text>
      </mj-column>
    </mj-section>
  </mj-body>
</mjml>
