name: Waterpark Mobile Builds

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: waterpark-mobile-builds
  cancel-in-progress: false

env:
  CAPACITOR_VERSION: 8.5.2
  APP_ID: com.waterpark.empire
  APP_NAME: Waterpark Empire

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Install Capacitor mobile tooling
        run: |
          npm install --no-save \
            @capacitor/core@${CAPACITOR_VERSION} \
            @capacitor/android@${CAPACITOR_VERSION} \
            @capacitor/cli@${CAPACITOR_VERSION}
          node -e "console.log('Capacitor Android:', require.resolve('@capacitor/android/package.json'))"
          node -e "console.log('Capacitor CLI:', require.resolve('@capacitor/cli/package.json'))"

      - name: Build web app
        run: npm run build

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<EOF
          {
            "appId": "${APP_ID}",
            "appName": "${APP_NAME}",
            "webDir": "dist",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Waterpark-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS Simulator Build
    runs-on: macos-15
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Install Capacitor mobile tooling
        run: |
          npm install --no-save \
            @capacitor/core@${CAPACITOR_VERSION} \
            @capacitor/ios@${CAPACITOR_VERSION} \
            @capacitor/cli@${CAPACITOR_VERSION}
          node -e "console.log('Capacitor iOS:', require.resolve('@capacitor/ios/package.json'))"
          node -e "console.log('Capacitor CLI:', require.resolve('@capacitor/cli/package.json'))"

      - name: Build web app
        run: npm run build

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<EOF
          {
            "appId": "${APP_ID}",
            "appName": "${APP_NAME}",
            "webDir": "dist"
          }
          EOF

      - name: Add iOS platform
        run: npx cap add ios

      - name: Sync web assets
        run: npx cap sync ios

      - name: Build unsigned iOS simulator app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package simulator app
        run: |
          mkdir -p artifacts
          ditto build/ios/Build/Products/Debug-iphonesimulator/App.app artifacts/Waterpark.app

      - name: Upload iOS simulator app
        uses: actions/upload-artifact@v4
        with:
          name: Waterpark-iOS-simulator
          path: artifacts/Waterpark.app
          if-no-files-found: error
          retention-days: 14
